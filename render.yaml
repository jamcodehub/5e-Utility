services:
  - type: web
    name: lore-ledger-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false        # set to your Netlify URL e.g. https://lore-ledger.netlify.app
      - key: PORT
        value: 10000       # Render default
